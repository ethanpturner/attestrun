name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Every uv invocation asserts the lockfile is current instead of silently updating it.
env:
  UV_LOCKED: "1"

jobs:
  ci:
    name: lint / typecheck / test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
        with:
          # gitleaks scans full history.
          fetch-depth: 0
          # Nothing here pushes; dropping the token keeps a compromised step from writing.
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        id: install
        run: uv sync --locked --all-groups

      # Each check runs even when an earlier one failed, so one run reports every problem. They
      # are gated on the install rather than on `!cancelled()` alone, because `uv run` would
      # otherwise build its own environment and report green on top of a broken install.
      - name: ruff check
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: uv run ruff check --output-format=github .

      - name: ruff format
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: uv run ruff format --check --diff .

      - name: mypy
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: uv run mypy

      - name: pytest
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: uv run pytest -q

      # The tool's own claims, exercised end to end in a clean environment. A verification tool
      # that has only ever returned `verified` has not been tested, so each verdict is provoked.
      - name: a deterministic command round-trips to verified
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          set -euo pipefail
          uv run attestrun record --command "cat pyproject.toml" --input 'src/**/*.py' \
            --claim "pyproject.toml has these contents." --out /tmp/det.json
          uv run attestrun verify /tmp/det.json | tee /tmp/det.txt
          grep -q -- '-> verified' /tmp/det.txt \
            || { echo "::error::a deterministic command did not verify"; exit 1; }

      # DEC-008: an identical exit status with differing output is `unverifiable` -- re-execution
      # neither confirmed nor refuted the result. Reporting `contradicted` there would tell an
      # operator that a passing, unchanged command had failed verification, which is how the
      # decision was found: the first version of this step recorded `pytest`, whose printed
      # duration usually varies.
      #
      # `pytest` is the wrong command to assert it with. Its duration is incidentally variable, not
      # reliably so -- on this runner it rounded identically across both runs and the step failed
      # by verifying. `date +%s%N` differs every time by construction, so the assertion tests the
      # semantics rather than the timing of the machine it runs on.
      - name: a nondeterministic command is unverifiable, not contradicted
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          set -euo pipefail
          uv run attestrun record --command "date +%s%N" --input 'src/**/*.py' \
            --claim "the clock reported this value." --out /tmp/self.json
          uv run attestrun verify /tmp/self.json | tee /tmp/nd.txt || true
          grep -q -- '-> unverifiable' /tmp/nd.txt \
            || { echo "::error::a nondeterministic command did not report unverifiable"; exit 1; }
          grep -qE '^ +contradicted +' /tmp/nd.txt \
            && { echo "::error::a nondeterministic command was reported as contradicted"; exit 1; }
          echo "output nondeterminism is unverifiable, not a contradiction"

      - name: a moved input contradicts
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          set -euo pipefail
          printf '\n# CI perturbation\n' >> src/attestrun/verdict.py
          uv run attestrun verify /tmp/self.json --no-rerun | tee /tmp/moved.txt || true
          git checkout -- src/attestrun/verdict.py
          grep -qE '^ +contradicted +' /tmp/moved.txt \
            || { echo "::error::a moved input did not produce a contradiction"; exit 1; }

      # DEC-004: absence of the artifact is not evidence the recorded digest was wrong, and
      # `unverifiable` outranks `contradicted`. This is the precedence rule a verification tool is
      # most likely to get subtly wrong.
      #
      # The manifest deliberately covers docs rather than sources: removing a file under src/ stops
      # `attestrun` from importing at all, so the check would pass for the wrong reason -- the tool
      # would not run rather than reporting correctly.
      - name: a missing input is unverifiable, not contradicted
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          set -euo pipefail
          uv run attestrun record --command "true" --input 'docs/**/*.md' \
            --claim "the architecture documents have these contents." --out /tmp/docs.json
          mv docs/architecture/decision-log.md /tmp/dl.bak
          uv run attestrun verify /tmp/docs.json --no-rerun | tee /tmp/missing.txt || true
          mv /tmp/dl.bak docs/architecture/decision-log.md
          grep -qE '^ +unverifiable +' /tmp/missing.txt \
            || { echo "::error::a missing input did not report unverifiable"; exit 1; }
          grep -qE '^ +contradicted +' /tmp/missing.txt \
            && { echo "::error::a missing input was reported as contradicted"; exit 1; }
          echo "a missing input is unverifiable"

      # The committed manifests must still match the trees they were recorded against. Both
      # siblings have an answer-key check separate from their tool check (whence validates its
      # worked example, tearline its fixture arithmetic); this is the analogous one, and without it
      # a hand-edited manifest disagreeing with its own tree surfaces only as a tool failure.
      - name: the committed manifests match their trees
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          uv run python scripts/build_scenarios.py
          git diff --exit-code benchmarks/ \
            || { echo "::error::a committed manifest does not match its tree; re-run scripts/build_scenarios.py"; exit 1; }

      # Every registered scenario, plus the coverage requirement that each of the three verdicts is
      # produced by at least one of them.
      - name: benchmark scenarios agree with their expectations
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: uv run attestrun evaluate

      # The portfolio's thesis demonstrated on itself: attest a sibling project's real evaluation
      # run and re-derive it. Until now this existed only as a manifest in someone's /tmp.
      #
      # whence is chosen because its evaluate output is deterministic -- it replays recorded
      # fixtures with no timings -- so the result axis can reach `verified` rather than the
      # `unverifiable` that DEC-008 correctly gives anything with a clock in it.
      - name: attest a sibling project's evaluation run
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/ethanpturner/whence.git /tmp/whence

          # Warm the sibling's environment BEFORE recording. `uv run` prints "Installed N packages"
          # on its first invocation in a project and nothing afterwards, so a manifest recorded on
          # the first run captures environment setup noise that the verifying run cannot reproduce.
          # The first attempt at this step reported `unverifiable` for exactly that reason -- the
          # tool was right and the recording was of the wrong thing.
          (cd /tmp/whence && uv sync --locked --all-groups >/dev/null 2>&1)

          uv run attestrun record \
            --command "uv run whence evaluate" \
            --workdir /tmp/whence \
            --input 'benchmarks/**/*.yaml' --input 'benchmarks/**/*.json' --input 'src/**/*.py' \
            --claim "whence resolves every recorded scenario in agreement with its authored truth sets, offline and without credentials." \
            --out /tmp/cross.json
          uv run attestrun verify /tmp/cross.json --workdir /tmp/whence | tee /tmp/cross.txt
          grep -q -- '-> verified' /tmp/cross.txt \
            || { echo "::error::could not re-derive whence's evaluation claim"; exit 1; }

          # And that the chain actually bites across repositories, not just within one.
          printf '\n# perturbation\n' >> /tmp/whence/benchmarks/scenarios.yaml
          uv run attestrun verify /tmp/cross.json --workdir /tmp/whence --no-rerun | tee /tmp/cross2.txt || true
          grep -qE '^ +contradicted +' /tmp/cross2.txt \
            || { echo "::error::a moved input in the sibling repository was not caught"; exit 1; }
          echo "attested a sibling project's run, and caught a change to it"

      # gitleaks is the enforcement point a local hook cannot provide.
      - name: gitleaks
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks detect --source . --no-banner --redact

      - name: the built wheel exposes the CLI
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          uv build
          uv run --isolated --with dist/*.whl attestrun --help
